<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weights Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one dark world. Warm near-black ground, dusty-rose type set large, light and uppercase, tiny caps captions, hairline rules, numbered lifts, and brushed steel (the plates) as the only bright material. Single theme by choice. */
:root{
  --bg:#0b090a; --surface:#141112; --sunk:#201a1d; --line:#35292e; --ink:#dccbd2; --bright:#f6eef1; --muted:#96818b;
  --accent:#d1bcc3; --on-accent:#120e10; --bad:#ff9a8f;
  --steel:linear-gradient(100deg,#4a3a41 0%,#bfa9b2 24%,#f5ecef 40%,#a48b96 58%,#57454d 82%,#8d7580 100%);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:.98;text-wrap:balance;letter-spacing:-.035em;text-transform:uppercase;color:var(--accent)}
h1{font-size:19px;letter-spacing:-.02em;text-transform:none;color:var(--bright);font-weight:500}
h1 sup{font-size:11px;color:var(--muted);margin-left:2px;letter-spacing:.04em}
h2{font-size:40px}
h3{font-size:25px;letter-spacing:-.03em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;min-height:46px}
.rest{font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border:0;padding:7px 12px;cursor:pointer}
.rest[hidden]{display:none}
nav{display:flex;gap:14px;justify-content:space-between;margin-top:6px;border-bottom:1px solid var(--line)}
nav a{padding:10px 0;text-decoration:none;color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid transparent;margin-bottom:-1px}
nav a[aria-current="page"]{color:var(--bright);border-bottom-color:var(--bright)}
main{padding:12px 0 64px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-top:1px solid var(--line);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.card.hero{position:relative;overflow:hidden;min-height:330px;justify-content:flex-end;gap:20px;padding:20px 16px;border-top:0;
  background:radial-gradient(120% 90% at 85% 0%,#2a2025 0%,#151113 55%,#0f0c0d 100%)}
.card.hero>*{position:relative;z-index:1}
/* A weight plate in brushed steel, cropped by the card. */
.card.hero::before{content:"";position:absolute;right:-96px;top:-120px;width:290px;height:290px;border-radius:50%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle,#0b090a 0 8.5%,transparent 9%),
    radial-gradient(circle,transparent 0 20%,rgba(11,9,10,.6) 20.5% 22%,transparent 22.5% 60%,rgba(11,9,10,.55) 60.5% 62.5%,transparent 63% 94%,rgba(11,9,10,.5) 94.5%),
    conic-gradient(from 205deg,#2c2327,#dccad1,#6f5864,#231b1f,#bda8b1,#48383f,#f3e8ec,#3a2e33,#856075,#2c2327);
  box-shadow:0 30px 60px rgba(0,0,0,.6)}
.hero h2{font-size:46px;max-width:9ch}
.eyebrow{font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);padding:12px 16px;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;min-height:48px}
.btn.primary{background:var(--steel);border-color:transparent;color:var(--on-accent);font-weight:700}
.btn.quiet{border-color:transparent;color:var(--muted);padding:8px 0;min-height:40px;margin-right:14px}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.quiet.danger{border-color:transparent}
.btn.wide{flex:1}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan-row{width:100%;display:grid;grid-template-columns:34px 1fr auto 74px;gap:10px;align-items:baseline;background:transparent;border:0;padding:13px 0;text-align:left;cursor:pointer;min-height:48px}
.pname{font-size:16px;color:var(--bright);text-transform:uppercase;letter-spacing:-.01em;line-height:1.15}
.flag{color:var(--accent);font-weight:700}
.preps{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.pkg{text-align:right;font-weight:300;font-size:26px;line-height:.9;letter-spacing:-.05em;white-space:nowrap;color:transparent;background:var(--steel);-webkit-background-clip:text;background-clip:text}
.pkg small{font-size:10px;font-weight:600;letter-spacing:.1em;margin-left:3px;color:var(--muted);text-transform:uppercase}
.pkg.small-n{font-size:18px;letter-spacing:-.02em}
.plan-row.all .pname{color:var(--muted);text-decoration:line-through}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88%;margin:auto auto 0;border-top:1px solid var(--accent);overflow-y:auto}
dialog::backdrop{background:rgba(5,3,4,.78)}
#sheet-body{padding:22px 16px 28px;display:flex;flex-direction:column;gap:16px}
.facts{margin:0;display:flex;flex-direction:column}
.facts div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.facts dt{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.facts dd{margin:0;color:var(--bright);overflow-wrap:anywhere}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
.tiles{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tile{background:var(--surface);border-top:1px solid var(--line);padding:16px 16px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.tile-top{display:flex;flex-direction:column;gap:6px}
.tile-top strong{font-size:22px;font-weight:400;letter-spacing:-.03em;line-height:1;text-transform:uppercase;color:var(--bright)}
.idx{font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.tile-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.meta{margin:0;display:grid;gap:3px;font-size:10.5px;min-width:0;text-transform:uppercase;letter-spacing:.07em}
.meta div{display:grid;grid-template-columns:70px 1fr;gap:8px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.mark{font-weight:300;font-size:64px;line-height:.8;letter-spacing:-.06em;white-space:nowrap;color:transparent;background:var(--steel);-webkit-background-clip:text;background-clip:text}
.mark small{font-size:11px;font-weight:600;letter-spacing:.1em;margin-left:4px;color:var(--muted);text-transform:uppercase}
.target{font-weight:500;font-size:17px;letter-spacing:-.01em;color:var(--bright)}
.load{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.why{font-size:12.5px;color:var(--muted)}
.why.up,.why.warn{color:var(--bright);font-weight:500}
.why.up::before{content:"+ "}
.why.warn::before{content:"! "}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr auto 1fr auto 52px;gap:8px;align-items:center;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.set .n{color:var(--muted);font-weight:600}
.set .n::before{content:"0"}
.set input{width:100%;min-width:0;height:54px;border:0;border-bottom:1px solid var(--line);background:var(--sunk);text-align:center;font-weight:300;font-size:30px;letter-spacing:-.04em;padding:0 4px;color:var(--bright)}
.tick{height:54px;border:1px solid var(--accent);background:transparent;font-size:20px;cursor:pointer;color:var(--accent)}
.tick[aria-pressed="true"]{background:var(--steel);border-color:transparent;color:var(--on-accent)}
.set.done input{border-bottom-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;font-size:10.5px;color:var(--muted);font-weight:600;min-width:0;letter-spacing:.1em;text-transform:uppercase}
.field input,.field select,.field textarea,.plain{height:48px;border:0;border-bottom:1px solid var(--line);background:var(--sunk);padding:0 10px;font-size:16px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--bright);width:100%;min-width:0}
.field textarea,textarea.plain{height:auto;padding:10px;min-height:76px;resize:vertical;font-family:var(--body)}
.hero .field input{background:rgba(11,9,10,.55)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .span3{grid-column:1/-1}
.grid.two{grid-template-columns:1fr 1fr}
.card-sub{display:flex;flex-direction:column;gap:10px}
.card-sub:empty{display:none}
.grid .span2{grid-column:span 2}
.banner{background:var(--sunk);border-left:2px solid var(--accent);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--bright)}
.note{background:var(--sunk);border-left:2px solid var(--bad);padding:10px 12px;font-size:14px;color:var(--bright)}
.pb{display:inline-block;background:var(--steel);color:var(--on-accent);font-weight:700;padding:4px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center}
.stepper input{height:84px;text-align:center;font-weight:300;font-size:64px;letter-spacing:-.06em;border:0;border-bottom:1px solid var(--line);background:var(--sunk);width:100%;min-width:0;color:var(--bright)}
.stepper button{height:84px;font-size:24px;padding:0}
.barbell{display:flex;align-items:center;justify-content:center;gap:2px;height:120px;overflow-x:auto;padding:0 4px}
.barbell .shaft{height:8px;background:linear-gradient(180deg,#f5ecef,#8a717c 55%,#3b2f34);flex:0 0 76px}
.barbell .end{height:12px;background:linear-gradient(180deg,#f5ecef,#8a717c 55%,#3b2f34);flex:0 0 18px}
.barbell .plate{background:linear-gradient(180deg,#3b2f34 0%,#cdb8c0 22%,#f5ecef 34%,#8a717c 58%,#48383f 100%);flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 14px;font-weight:500;cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-height:40px}
.meter{height:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--steel)}
details{border-top:1px solid var(--line);padding:13px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500;color:var(--bright);display:flex;justify-content:space-between;gap:12px}
summary .muted{font-weight:400;font-size:13px;text-align:right}
details .body{padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
strong{font-weight:600;color:var(--bright)}
.sync{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 0 0}
.out{display:none}
.out.show{display:block}
[hidden]{display:none!important}
.hero-actions{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:rgba(11,9,10,.55)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:0 6px;min-height:46px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fig{display:block;width:100%;height:auto;max-height:460px}
.fig .body{fill:#ddd2d6}
.fig .body-line{fill:#ddd2d6;stroke:#7d6a73;stroke-width:2.6;stroke-linejoin:round}
.fig .hair{fill:#b3a1a9;stroke:#7d6a73;stroke-width:1}
.fig .hand{fill:#ddd2d6;stroke:#7d6a73;stroke-width:1.3}
.fig .m{fill:#cabbc1;stroke:#8f7b85;stroke-width:1;stroke-linejoin:round;cursor:pointer}
.fig .m.under{stroke-dasharray:3 2}
.fig .m.hit2{fill:#b592a5}
.fig .m.hit{fill:#7a536a}
.fig .m.sel{fill:#43273a;stroke:#43273a}
#sheet-body .fig{max-height:250px}
.fig text{fill:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.side,.flow{display:contents}
.banner{order:-1}
/* Desktop: two columns. The lead card and summary stay put on the left; the working list scrolls on the right. */
@media (min-width:900px){
  .wrap{max-width:1180px;padding:0 32px}
  h1{font-size:22px}
  main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start;padding-top:16px}
  .side,.flow{display:flex;flex-direction:column;gap:10px;min-width:0;grid-row:1}
  .side{grid-column:1}
  .flow{grid-column:2}
  .side:empty{display:none}
  .side:empty+.flow{grid-column:1/-1}
  nav{justify-content:flex-start;gap:24px}
  main:not([data-view="setup"]) .side{position:sticky;top:116px;max-height:calc(100vh - 132px);overflow-y:auto}
  .banner{order:0}
  .card{padding:22px 22px}
  .card.hero{min-height:440px;padding:26px 22px}
  .card.hero::before{width:380px;height:380px;right:-110px;top:-150px}
  .hero h2{font-size:62px}
  main[data-view="draft"] .card.hero{min-height:250px}
  main[data-view="draft"] .card.hero::before{width:290px;height:290px;right:-96px;top:-130px}
  main[data-view="draft"] .hero h2{font-size:44px}
  .plan-row{padding:15px 0}
  .pname{font-size:18px}
  dialog{margin:auto;border:1px solid var(--line)}
  #sheet-body{padding:26px 24px 28px}
}
@media (min-width:1240px){
  main[data-view="draft"] .flow,main[data-view="setup"] .flow{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .flow .span{grid-column:1/-1}
}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}.grid .span2{grid-column:1/-1}.mark{font-size:54px}.hero h2{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Weights Log<sup>kg</sup></h1>
      <button class="rest" id="rest" type="button" hidden title="Tap to clear">Rest 0:00</button>
    </div>
    <nav aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#plates" data-tab="plates">Plates</a>
      <a href="#muscles" data-tab="muscles">Muscles</a>
      <a href="#history" data-tab="history">History</a>
      <a href="#setup" data-tab="setup">Setup</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <div class="sync" id="sync" role="status"></div>
  <main id="view"></main>
</div>

<dialog id="sheet" aria-label="Muscles and guide"><div id="sheet-body"></div></dialog>

<script>
/*PURE-START*/
var DAYS={back:'Back & Biceps',chest:'Chest & Triceps'};
var KINDS={bar:'Barbell',db:'Dumbbell',bw:'Bodyweight'};
function defaults(){
  var x=function(id,name,kind,sets,min,max,kg,step,goal){return {id:id,name:name,kind:kind,sets:sets,min:min,max:max,kg:kg,step:step,goal:goal||0}};
  return {v:1,sessions:[],meta:{updatedAt:0,bar:8,deleted:[],draft:null,
    plates:[{kg:10,n:6},{kg:7.5,n:2},{kg:2.5,n:2},{kg:2,n:2},{kg:1.25,n:4},{kg:1,n:4}],
    program:{
      back:[
        x('deadlift','Deadlift','bar',3,5,5,86,2,140),
        x('bb-row','Bent-over row','bar',3,8,8,70,2),
        x('pullup-neg','Pull-up negatives','bw',3,2,3,0,0),
        x('db-row','Single-arm dumbbell row','db',3,8,8,22,2),
        x('pullover','Barbell pullover','bar',3,10,10,28,2),
        x('hammer','Hammer curl','db',3,8,8,17,1),
        x('rear-delt','Rear delt flyes','db',3,12,15,6,1)
      ],
      chest:[
        x('paused-bench','Paused bench press','bar',4,3,3,78,2,100),
        x('ng-press','Neutral-grip dumbbell press','db',3,8,10,0,2),
        x('incline','Incline press','db',3,8,10,0,2),
        x('skulls','Skull crushers','bar',3,10,10,0,2),
        x('thumbs-up','Thumbs-up raises','db',3,12,12,0,1)
      ]
    }}};
}
function r2(n){return Math.round(n*100)/100}
function fmt(n){return String(r2(n))}
/* Every weight one side of the bar can carry, with the fewest plates that make it. Keys are kg x 100. */
function sideCombos(plates){
  var inv=plates.map(function(p){return [p.kg,Math.floor(p.n/2)]}).filter(function(p){return p[0]>0&&p[1]>0}).sort(function(a,b){return b[0]-a[0]});
  var m=new Map([[0,[]]]);
  inv.forEach(function(p){
    var next=new Map(m);
    m.forEach(function(list,sum){
      for(var k=1;k<=p[1];k++){
        var s=sum+Math.round(p[0]*100)*k, l=list.concat(Array(k).fill(p[0]));
        if(!next.has(s)||next.get(s).length>l.length) next.set(s,l);
      }
    });
    m=next;
  });
  return m;
}
function totals(meta){
  var out=[];sideCombos(meta.plates).forEach(function(list,side){out.push(r2(meta.bar+side*2/100))});
  return out.sort(function(a,b){return a-b});
}
function loading(meta,total){
  var side=Math.round((total-meta.bar)*50), list=sideCombos(meta.plates).get(side);
  return list?{side:side/100,plates:list}:null;
}
function nearest(meta,total){
  var t=totals(meta),below=null,above=null;
  t.forEach(function(v){if(v<=total+1e-9)below=v; if(above===null&&v>=total-1e-9)above=v});
  return {below:below,above:above,max:t[t.length-1],exact:below!==null&&Math.abs(below-total)<1e-9};
}
function loadText(meta,total){
  if(!(total>0)) return '';
  if(total<meta.bar) return 'Lighter than the '+fmt(meta.bar)+' kg bar';
  var l=loading(meta,total);
  if(l) return l.plates.length?fmt(meta.bar)+' bar + '+fmt(l.side)+' per side ('+l.plates.map(fmt).join(' + ')+')':'Empty '+fmt(meta.bar)+' kg bar';
  var n=nearest(meta,total);
  if(n.above===null) return 'More than your plates allow. Heaviest bar: '+fmt(n.max)+' kg';
  return 'Your plates can\'t make '+fmt(total)+'. Nearest: '+fmt(n.below)+' or '+fmt(n.above)+' kg';
}
function e1rm(kg,reps){return reps<=1?kg:kg*(1+reps/30)}
/* Finished sessions that include this lift, newest first, done sets only. */
function liftHistory(S,ex){
  var out=[];
  S.sessions.forEach(function(s){
    s.entries.forEach(function(e){
      if(e.exId===ex.id){var sets=e.sets.filter(function(x){return x.reps>0});if(sets.length)out.push({date:s.date,at:s.updatedAt||0,sets:sets})}
    });
  });
  return out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.at-a.at});
}
function workSets(h){var top=Math.max.apply(null,h.sets.map(function(s){return s.kg}));return {top:top,sets:h.sets.filter(function(s){return s.kg===top})}}
/* Next target for a lift: add weight once every set hits the top of the rep range; hold after misses; drop about 10% on a third miss. */
function suggest(S,ex){
  var h=liftHistory(S,ex), base=function(kg,reps,why,tone){return {kg:kg,reps:reps,why:why,tone:tone||'',last:h[0]||null}};
  var fill=function(n){var a=[];for(var i=0;i<ex.sets;i++)a.push(n);return a};
  if(!h.length) return base(ex.kg,fill(ex.max),ex.kind==='bw'?'':(ex.kg>0?'Starting weight. Change it if it\'s wrong.':'No weight yet. Enter what you use.'),ex.kind!=='bw'&&!(ex.kg>0)?'warn':'');
  var w=workSets(h[0]), top=w.top;
  var hitAll=w.sets.length>=ex.sets&&w.sets.every(function(s){return s.reps>=ex.max});
  if(hitAll&&ex.step>0){
    var want=r2(top+ex.step);
    if(ex.kind==='bar'){
      var n=nearest(S.meta,want);
      if(n.above===null) return base(top,fill(ex.max),'You hit every set, but '+fmt(n.max)+' kg is every plate you own.','warn');
      want=n.above;
    }

function musclesIn(text){

    if(/upper back/.test(t)){add('traps');add('rhomboids')}

    if(/trap/.test(t))add('traps'); if(/rhomboid/.test(t))add('rhomboids'); if(/\blats?\b/.test(t))add('lats');
    if(/rotator|cuff/.test(t))add('cuff'); if(/tricep/.test(t))add('triceps'); if(/bicep/.test(t))add('biceps');
    if(/brachialis/.test(t))add('brachialis'); if(/forearm|grip|brachioradialis/.test(t))add('forearms');
    if(/chest|pec/.test(t))add('chest'); if(/core|\babs\b|abdominal/.test(t))add('abs'); if(/serratus/.test(t))add('serratus');

async function initCloud(){

    if(!got[0]||!got[1]){setSync('device');return}
    var id=await got[1].id(); if(!id){setSync('device');return}
    var col=got[0].collection('data/users/'+id);
    var snap=await Promise.race([col.get(),new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},10000)})]);
    var remoteMeta=null,remoteMonths={};
    snap.docs.forEach(function(d){if(!d.exists)return;var data=clone(d.data());if(d.id==='meta')remoteMeta=data;else if(d.id.indexOf('m_')===0)remoteMonths[d.id]=data});
    var localNewer=!remoteMeta||(S.meta.updatedAt||0)>(remoteMeta.updatedAt||0);
    var gone=new Set((S.meta.deleted||[]).concat(remoteMeta&&remoteMeta.deleted||[]));
    if(remoteMeta&&!localNewer&&valid({meta:remoteMeta,sessions:[]})) S.meta=remoteMeta;
    S.meta.deleted=Array.from(gone);
    var byId={};S.sessions.forEach(function(s){byId[s.id]=s});

    S.sessions=Object.keys(byId).map(function(k){return byId[k]}).filter(function(s){return !gone.has(s.id)});
    saveLocal();cloud=col;setSync('cloud');
    var keys=new Set(Object.keys(remoteMonths));S.sessions.forEach(function(s){keys.add(monthKey(s.date))});

}

function startSession(day){

    var s=suggest(S,ex);
    return {exId:ex.id,name:ex.name,kind:ex.kind,target:targetText(ex,s.kg),why:s.why,tone:s.tone,last:s.last?setsText(s.last.sets):'',
      sets:s.reps.map(function(r){return {kg:s.kg,reps:r,done:false}})};

  summary=null;touch();render();window.scrollTo(0,0);
}
function finishSession(){
  var d=S.meta.draft, entries=d.entries.map(function(e){return {exId:e.exId,name:e.name,kind:e.kind,sets:e.sets.filter(function(s){return s.done&&s.reps>0}).map(function(s){return {kg:s.kg,reps:s.reps}})}}).filter(function(e){return e.sets.length});
  if(!entries.length){var m=$('#d-msg');m.hidden=false;m.textContent='Tick at least one set before saving.';return}
  var date=/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:todayStr();
  var session={id:d.id,type:d.type,date:date,rpe:d.rpe||'',notes:d.notes||'',entries:entries,updatedAt:Date.now()};
  var pbs=personalBests(S,session);
  S.sessions.push(session);S.meta.draft=null;stopRest();
  summary={id:session.id,type:session.type,date:session.date,pbs:pbs};
  touch();pushMonth(monthKey(session.date));
  if(sheetCfg().url){summary.sheet='sending';sendToSheet([session]).then(function(r){if(summary&&summary.id===session.id){summary.sheet=r.ok?'sent':r.error;if(route()==='today'&&!S.meta.draft)render()}})}
  render();window.scrollTo(0,0);
}

function copyOut(text,outId,msgId,what){
  var out=$('#'+outId),msg=$('#'+msgId);

  out.value=text;out.classList.add('show');
  var fail=function(){msg.textContent='Copying was blocked. Select the text above and copy it yourself.';out.focus();out.select()};
  try{navigator.clipboard.writeText(text).then(function(){msg.textContent=what+' copied.'},fail)}catch(e){fail()}

  if(a!=='discard'&&a!=='del-session'&&a!=='ex-del'&&a!=='restore') armed=null;
  if(a==='start'){pickDay=null;startSession(day)}
  else if(a==='pick'){pickDay=day;summary=null;render()}
  else if(a==='guide'){openGuide(b.dataset.ex,b.dataset.name)}
  else if(a==='close-sheet'){closeSheet()}
  else if(a==='muscle'){selMuscle=b.dataset.m;closeSheet();if(route()==='muscles')render();else location.hash='muscles'}
  else if(a==='jump'){var el=$('#lift-'+b.dataset.e);if(el)el.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
  else if(a==='tick'){
    var row=b.closest('.set'),s=d.entries[+row.dataset.e].sets[+row.dataset.s];
    if(!s.done&&!(s.reps>0)){$('#reps-'+row.dataset.e+'-'+row.dataset.s).focus();return}
    s.done=!s.done;b.setAttribute('aria-pressed',s.done?'true':'false');row.classList.toggle('done',s.done);
    if(s.done)startRest();
    $('#overview').innerHTML=overview();
    $('#load-'+row.dataset.e).textContent=draftLoad(d.entries[+row.dataset.e]);touch();
  }
  else if(a==='add-set'){var e=d.entries[+b.dataset.e],l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:0,reps:l?l.reps:0,done:false});touch();render()}
  else if(a==='del-set'){d.entries[+b.dataset.e].sets.pop();touch();render()}
  else if(a==='finish'){finishSession()}
  else if(a==='discard'){if(arm('discard')){S.meta.draft=null;stopRest();touch();render()}}
  else if(a==='copy-rows'){var one=S.sessions.filter(function(s){return s.id===b.dataset.id});copyOut(sheetRows(one),'out-rows','msg-rows','Rows')}
  else if(a==='copy-all'){var all=S.sessions.slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0});copyOut(sheetRows(all),'out-setup','msg-setup','Rows')}
  else if(a==='copy-backup'){copyOut(JSON.stringify(S),'out-setup','msg-setup','Backup')}
  else if(a==='restore'){
    var o=null;try{o=JSON.parse($('#restore').value)}catch(e){}
    if(!valid(o)){armed=null;$('#msg-restore').textContent='That isn\'t a backup from this app. Paste the whole text you copied with Copy full backup.';return}
    if(arm('restore')){
      var gone=(S.meta.deleted||[]).concat(S.sessions.map(function(s){return s.id})), oldKeys=S.sessions.map(function(s){return monthKey(s.date)});
      S=o;var keep={};S.sessions.forEach(function(s){keep[s.id]=1;s.updatedAt=Date.now()});
      S.meta.deleted=gone.concat(S.meta.deleted||[]).filter(function(id,ix,arr){return !keep[id]&&arr.indexOf(id)===ix});
      plateTarget=null;summary=null;touch();
      new Set(oldKeys.concat(S.sessions.map(function(s){return monthKey(s.date)}))).forEach(pushMonth);render();
    }else{$('#restore').value=JSON.stringify(o)}
  }
  else if(a==='del-session'){
    if(arm('del-'+b.dataset.id)){var gs=S.sessions.filter(function(s){return s.id===b.dataset.id})[0];S.sessions=S.sessions.filter(function(s){return s.id!==b.dataset.id});S.meta.deleted.push(b.dataset.id);if(summary&&summary.id===b.dataset.id)summary=null;touch();if(gs)pushMonth(monthKey(gs.date));render()}
    else{var open=document.querySelectorAll('details');open.forEach(function(el){if(el.querySelector('[data-id="'+b.dataset.id+'"]'))el.open=true})}
  }
  else if(a==='send'||a==='send-unsent'){
    var list=a==='send'?S.sessions.filter(function(s){return s.id===b.dataset.id}):unsent();
    b.disabled=true;b.textContent='Sending\u2026';
    sendToSheet(list).then(function(r){
      sheetMsg=r.ok?(r.added?r.added+' row'+(r.added===1?'':'s')+' added to your sheet.':'Nothing new to add. The sheet already has these sessions.'):r.error;
      if(summary&&a==='send'&&summary.id===b.dataset.id)summary.sheet=r.ok?'sent':r.error;
      render();
    });
  }
  else if(a==='plate-set'){plateTarget=+b.dataset.kg;render()}
  else if(a==='plate-step'){
    var t=totals(S.meta),dir=+b.dataset.dir,next=dir>0?t.filter(function(v){return v>plateTarget+1e-9})[0]:t.filter(function(v){return v<plateTarget-1e-9}).pop();
    if(next!==undefined){plateTarget=next;render()}
  }
  else if(a==='ex-add'){S.meta.program[day].push({id:'x'+uid(),name:'New exercise',kind:'db',sets:3,min:8,max:10,kg:0,step:2,goal:0});touch();render();var all2=document.querySelectorAll('details');}
  else if(a==='ex-up'||a==='ex-down'){var arr=S.meta.program[day],j=a==='ex-up'?i-1:i+1,tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;touch();render()}
  else if(a==='ex-del'){if(arm('ex-'+day+'-'+i)){S.meta.program[day].splice(i,1);touch();render()}else{var dd=document.querySelectorAll('details');dd.forEach(function(el){if(el.querySelector('[data-act="ex-del"][data-day="'+day+'"][data-i="'+i+'"]'))el.open=true})}}
});
document.addEventListener('input',function(ev){
  var t=ev.target,d=S.meta.draft;
  if(t.id==='cv-kg'){convKg=num(t.value);$('#cv-lb').value=convKg>0?kgToLb(convKg):'';$('#cv-out').innerHTML=convOut();return}
  if(t.id==='cv-lb'){convKg=lbToKg(num(t.value));$('#cv-kg').value=convKg>0?fmt(convKg):'';$('#cv-out').innerHTML=convOut();return}
  if(d&&t.dataset.f){
    var row=t.closest('.set');
    if(row){var e=d.entries[+row.dataset.e],s=e.sets[+row.dataset.s];
      if(t.dataset.f==='kg'){s.kg=num(t.value);$('#load-'+row.dataset.e).textContent=draftLoad(e)}else s.reps=Math.round(num(t.value));
    }else d[t.dataset.f]=t.value;
    touch();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='plate-target'){plateTarget=num(t.value);render();return}
  if(t.dataset.p){
    var ex=S.meta.program[t.dataset.day][+t.dataset.i],p=t.dataset.p;
    if(p==='name')ex.name=t.value.trim()||ex.name;else if(p==='kind')ex.kind=t.value;
    else if(p==='main'||p==='also'||p==='video')ex[p]=t.value.trim();
    else if(p==='sets')ex.sets=Math.max(1,Math.min(10,Math.round(num(t.value))||1));
    else if(p==='min'||p==='max'){ex[p]=Math.max(1,Math.round(num(t.value))||1);if(ex.min>ex.max){if(p==='min')ex.max=ex.min;else ex.min=ex.max}}
    else ex[p]=num(t.value);
    touch();var sum=t.closest('details').querySelector('summary');sum.firstChild.textContent=ex.name;sum.lastChild.textContent=targetText(ex,ex.kg);
  }
  if(t.dataset.k==='sheet-url'){sheetCfg().url=t.value.trim();sheetMsg='';touch()}
  if(t.dataset.k==='sheet-key'){sheetCfg().key=t.value.trim();touch()}
  if(t.dataset.k==='bar'){S.meta.bar=num(t.value)||S.meta.bar;plateTarget=null;touch()}
  if(t.dataset.k==='plate'){S.meta.plates[+t.dataset.i].n=Math.max(0,Math.round(num(t.value)));plateTarget=null;touch()}
});
$('#rest').addEventListener('click',stopRest);
$('#sheet').addEventListener('click',function(ev){if(ev.target===this)closeSheet()});
window.addEventListener('hashchange',function(){closeSheet();armed=null;sheetMsg='';render();window.scrollTo(0,0)});
setSync('loading');render();initCloud();
</script>
</body>
</html>
