<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weights Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow phone column; a sticky header carries tabs and the rest clock; each lift is a card of big tappable set rows. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#e3e7ec; --ink:#141a21; --muted:#5a6572; --line:#d3d9e0;
  --accent:#2447d6; --on-accent:#ffffff; --good:#17794a; --good-bg:#dff3e8; --warn:#8a5a00; --warn-bg:#fbefd0; --bad:#b3261e;
  --iron:#39424e; --steel:#9aa5b1;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --surface:#181e26; --sunk:#11161c; --ink:#e9edf2; --muted:#97a3b1; --line:#2b3440;
    --accent:#8ea4ff; --on-accent:#0c1230; --good:#58c990; --good-bg:#15301f; --warn:#f0c060; --warn-bg:#33290f; --bad:#ff8f86;
    --iron:#c4ccd6; --steel:#5d6875;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#181e26; --sunk:#11161c; --ink:#e9edf2; --muted:#97a3b1; --line:#2b3440;
  --accent:#8ea4ff; --on-accent:#0c1230; --good:#58c990; --good-bg:#15301f; --warn:#f0c060; --warn-bg:#33290f; --bad:#ff8f86;
  --iron:#c4ccd6; --steel:#5d6875;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px;text-transform:uppercase}
h2{font-size:28px;text-transform:uppercase}
h3{font-size:21px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px}
.rest{font-family:var(--display);font-weight:600;font-size:18px;background:var(--warn-bg);color:var(--warn);border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
.rest[hidden]{display:none}
nav{display:flex;gap:4px;margin-top:8px}
nav a{flex:1;text-align:center;padding:10px 4px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:16px 0 56px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px}
.btn.danger{color:var(--bad)}
.btn.wide{flex:1}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.plan li:first-child{border-top:0;padding-top:0}
.target{font-family:var(--display);font-weight:600;font-size:20px}
.load{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.why{font-size:14px;color:var(--muted)}
.why.up{color:var(--good);font-weight:600}
.why.warn{color:var(--warn);font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:22px 1fr auto 1fr auto 48px;gap:8px;align-items:center}
.set .n{color:var(--muted);font-weight:600;text-align:center}
.set input{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);text-align:center;font-family:var(--display);font-weight:600;font-size:22px;padding:0 4px}
.tick{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:20px;cursor:pointer;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.set.done input{border-color:var(--good)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
.field input,.field select,.field textarea,.plain{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 10px;font-size:16px;font-weight:400;color:var(--ink);width:100%;min-width:0}
.field textarea,textarea.plain{height:auto;padding:10px;min-height:76px;resize:vertical;font-family:var(--body)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid .span3{grid-column:1/-1}
.grid .span2{grid-column:span 2}
.banner{background:var(--good-bg);border:1px solid var(--good);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500}
.pb{display:inline-block;background:var(--good-bg);color:var(--good);font-weight:600;border-radius:999px;padding:2px 10px;font-size:14px}
.big{font-family:var(--display);font-weight:700;font-size:54px;line-height:1}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper input{height:60px;text-align:center;font-family:var(--display);font-weight:700;font-size:34px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);width:100%;min-width:0}
.stepper button{height:60px;font-size:26px}
.barbell{display:flex;align-items:center;justify-content:center;gap:2px;height:104px;overflow-x:auto;padding:0 4px}
.barbell .shaft{height:8px;background:var(--steel);flex:0 0 76px;border-radius:2px}
.barbell .end{height:12px;background:var(--steel);flex:0 0 18px;border-radius:2px}
.barbell .plate{background:var(--iron);border-radius:3px;flex:0 0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:500;cursor:pointer;font-size:14px;min-height:40px}
.meter{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:12px}
details .body{padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.sync{font-size:13px;color:var(--muted);padding:6px 0 0}
.out{display:none}
.out.show{display:block}
[hidden]{display:none!important}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}.grid .span2{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Weights Log</h1>
      <button class="rest" id="rest" type="button" hidden title="Tap to clear">Rest 0:00</button>
    </div>
    <nav aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#plates" data-tab="plates">Plates</a>
      <a href="#history" data-tab="history">History</a>
      <a href="#setup" data-tab="setup">Setup</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <div class="sync" id="sync" role="status"></div>
  <main id="view"></main>
</div>

<script>
/*PURE-START*/
var DAYS={back:'Back & Biceps',chest:'Chest & Triceps'};
var KINDS={bar:'Barbell',db:'Dumbbell',bw:'Bodyweight'};
function defaults(){
  var x=function(id,name,kind,sets,min,max,kg,step,goal){return {id:id,name:name,kind:kind,sets:sets,min:min,max:max,kg:kg,step:step,goal:goal||0}};
  return {v:1,sessions:[],meta:{updatedAt:0,bar:8,deleted:[],draft:null,
    plates:[{kg:10,n:6},{kg:7.5,n:2},{kg:2.5,n:2},{kg:2,n:2},{kg:1.25,n:4},{kg:1,n:4}],
    program:{
      back:[
        x('deadlift','Deadlift','bar',3,5,5,86,2,140),
        x('bb-row','Bent-over row','bar',3,8,8,70,2),
        x('pullup-neg','Pull-up negatives','bw',3,2,3,0,0),
        x('db-row','Single-arm dumbbell row','db',3,8,8,22,2),
        x('pullover','Barbell pullover','bar',3,10,10,28,2),
        x('hammer','Hammer curl','db',3,8,8,17,1),
        x('rear-delt','Rear delt flyes','db',3,12,15,6,1)
      ],
      chest:[
        x('paused-bench','Paused bench press','bar',4,3,3,78,2,100),
        x('ng-press','Neutral-grip dumbbell press','db',3,8,10,0,2),
        x('incline','Incline press','db',3,8,10,0,2),
        x('skulls','Skull crushers','bar',3,10,10,0,2),
        x('thumbs-up','Thumbs-up raises','db',3,12,12,0,1)
      ]
    }}};
}
function r2(n){return Math.round(n*100)/100}
function fmt(n){return String(r2(n))}
/* Every weight one side of the bar can carry, with the fewest plates that make it. Keys are kg x 100. */
function sideCombos(plates){
  var inv=plates.map(function(p){return [p.kg,Math.floor(p.n/2)]}).filter(function(p){return p[0]>0&&p[1]>0}).sort(function(a,b){return b[0]-a[0]});
  var m=new Map([[0,[]]]);
  inv.forEach(function(p){
    var next=new Map(m);
    m.forEach(function(list,sum){
      for(var k=1;k<=p[1];k++){
        var s=sum+Math.round(p[0]*100)*k, l=list.concat(Array(k).fill(p[0]));
        if(!next.has(s)||next.get(s).length>l.length) next.set(s,l);
      }
    });
    m=next;
  });
  return m;
}
function totals(meta){
  var out=[];sideCombos(meta.plates).forEach(function(list,side){out.push(r2(meta.bar+side*2/100))});
  return out.sort(function(a,b){return a-b});
}
function loading(meta,total){
  var side=Math.round((total-meta.bar)*50), list=sideCombos(meta.plates).get(side);
  return list?{side:side/100,plates:list}:null;
}
function nearest(meta,total){
  var t=totals(meta),below=null,above=null;
  t.forEach(function(v){if(v<=total+1e-9)below=v; if(above===null&&v>=total-1e-9)above=v});
  return {below:below,above:above,max:t[t.length-1],exact:below!==null&&Math.abs(below-total)<1e-9};
}
function loadText(meta,total){
  if(!(total>0)) return '';
  if(total<meta.bar) return 'Lighter than the '+fmt(meta.bar)+' kg bar';
  var l=loading(meta,total);
  if(l) return l.plates.length?fmt(meta.bar)+' bar + '+fmt(l.side)+' per side ('+l.plates.map(fmt).join(' + ')+')':'Empty '+fmt(meta.bar)+' kg bar';
  var n=nearest(meta,total);
  if(n.above===null) return 'More than your plates allow. Heaviest bar: '+fmt(n.max)+' kg';
  return 'Your plates can\'t make '+fmt(total)+'. Nearest: '+fmt(n.below)+' or '+fmt(n.above)+' kg';
}
function e1rm(kg,reps){return reps<=1?kg:kg*(1+reps/30)}
/* Finished sessions that include this lift, newest first, done sets only. */
function liftHistory(S,ex){
  var out=[];
  S.sessions.forEach(function(s){
    s.entries.forEach(function(e){
      if(e.exId===ex.id){var sets=e.sets.filter(function(x){return x.reps>0});if(sets.length)out.push({date:s.date,at:s.updatedAt||0,sets:sets})}
    });
  });
  return out.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.at-a.at});
}
function workSets(h){var top=Math.max.apply(null,h.sets.map(function(s){return s.kg}));return {top:top,sets:h.sets.filter(function(s){return s.kg===top})}}
/* Next target for a lift: add weight once every set hits the top of the rep range; hold after misses; drop about 10% on a third miss. */
function suggest(S,ex){
  var h=liftHistory(S,ex), base=function(kg,reps,why,tone){return {kg:kg,reps:reps,why:why,tone:tone||'',last:h[0]||null}};
  var fill=function(n){var a=[];for(var i=0;i<ex.sets;i++)a.push(n);return a};
  if(!h.length) return base(ex.kg,fill(ex.max),ex.kind==='bw'?'':(ex.kg>0?'Starting weight. Change it if it\'s wrong.':'No weight yet. Enter what you use.'),ex.kind!=='bw'&&!(ex.kg>0)?'warn':'');
  var w=workSets(h[0]), top=w.top;
  var hitAll=w.sets.length>=ex.sets&&w.sets.every(function(s){return s.reps>=ex.max});
  if(hitAll&&ex.step>0){
    var want=r2(top+ex.step);
    if(ex.kind==='bar'){
      var n=nearest(S.meta,want);
      if(n.above===null) return base(top,fill(ex.max),'You hit every set, but '+fmt(n.max)+' kg is every plate you own.','warn');
      want=n.above;
    }
    return base(want,fill(ex.min),'Every set hit '+ex.max+' last time. Up from '+fmt(top)+' kg.','up');
  }
  var misses=0;
  for(var i=0;i<h.length;i++){var wi=workSets(h[i]);if(wi.top===top&&wi.sets.some(function(s){return s.reps<ex.min}))misses++;else break}
  if(misses>=3&&top>0){
    var drop=top*0.9;
    if(ex.kind==='bar'){var nd=nearest(S.meta,drop);drop=nd.below!==null?nd.below:top}else drop=Math.round(drop);
    return base(drop,fill(ex.min),'Missed reps three sessions running at '+fmt(top)+' kg. Drop about 10% this week.','warn');
  }
  var reps=[];for(var j=0;j<ex.sets;j++){var prev=w.sets[j]?w.sets[j].reps:ex.min-1;reps.push(Math.max(ex.min,Math.min(ex.max,prev+1)))}
  if(misses===2) return base(top,reps,'Missed reps twice at this weight. Hold it and hit the reps.','warn');
  return base(top,reps,hitAll?'Same as last time.':'Same weight. Add reps until every set hits '+ex.max+'.');
}
function targetText(ex,kg){
  var reps=ex.min===ex.max?ex.max:ex.min+'–'+ex.max;
  var w=ex.kind==='bw'?(kg>0?'bodyweight + '+fmt(kg)+' kg':'bodyweight'):(kg>0?fmt(kg)+' kg':'weight not set');
  return ex.sets+' × '+reps+' @ '+w;
}
function setsText(sets){
  var groups=[];
  sets.forEach(function(s){var g=groups[groups.length-1];if(g&&g.kg===s.kg)g.reps.push(s.reps);else groups.push({kg:s.kg,reps:[s.reps]})});
  return groups.map(function(g){return (g.kg>0?fmt(g.kg)+' kg':'bodyweight')+' × '+g.reps.join(', ')}).join(' / ');
}
function nextDay(S){
  var last=S.sessions.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.updatedAt||0)-(a.updatedAt||0)})[0];
  return last&&last.type==='back'?'chest':'back';
}
/* Lifts in this session whose best estimated one-rep max beats every earlier session. */
function personalBests(S,session){
  var out=[];
  session.entries.forEach(function(e){
    var best=0,prev=0,bestSet=null;
    e.sets.forEach(function(s){if(s.reps>0&&s.kg>0){var v=e1rm(s.kg,s.reps);if(v>best){best=v;bestSet=s}}});
    S.sessions.forEach(function(o){if(o.id!==session.id)o.entries.forEach(function(oe){if(oe.exId===e.exId)oe.sets.forEach(function(s){if(s.reps>0&&s.kg>0)prev=Math.max(prev,e1rm(s.kg,s.reps))})})});
    if(prev>0&&best>prev+0.01) out.push(e.name+' '+fmt(bestSet.kg)+' kg × '+bestSet.reps);
  });
  return out;
}
function sheetRows(sessions){
  var rows=[];
  sessions.forEach(function(s){s.entries.forEach(function(e){e.sets.forEach(function(x,i){
    rows.push([s.date,DAYS[s.type]||s.type,e.name,i+1,fmt(x.kg),x.reps,s.rpe||'',i===0&&e===s.entries[0]?(s.notes||'').replace(/[\t\n]+/g,' '):''].join('\t'));
  })})});
  return rows.join('\n');
}
function sheetArrays(sessions){
  var rows=[];
  sessions.forEach(function(s){var first=true;s.entries.forEach(function(e){e.sets.forEach(function(x,i){
    rows.push([s.date,DAYS[s.type]||s.type,e.name,i+1,r2(x.kg),x.reps,parseFloat(s.rpe)||'',first?(s.notes||''):'',s.id]);first=false;
  })})});
  return rows;
}
/*PURE-END*/

var LS='weights-log-v1', S=load(), summary=null, sheetMsg='', plateTarget=null, armed=null, restStart=0, restTimer=null, syncState='loading', cloud=null;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>0?n:0}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function niceDate(s){var d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function valid(o){return o&&o.meta&&o.meta.program&&Array.isArray(o.meta.program.back)&&Array.isArray(o.meta.program.chest)&&Array.isArray(o.sessions)&&Array.isArray(o.meta.plates)}
function load(){try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);if(valid(o)){o.meta.deleted=o.meta.deleted||[];return o}}}catch(e){}return defaults()}
function sheetCfg(){return S.meta.sheet||(S.meta.sheet={url:'',key:''})}
function unsent(){return S.sessions.filter(function(s){return !s.sent})}
/* Append sessions to the Google Sheet through its Apps Script address. The script skips any session it already holds, so sending twice is safe. */
async function sendToSheet(sessions){
  var c=sheetCfg();
  if(!c.url) return {ok:false,error:'No sheet address saved yet. Add it in Setup.'};
  if(!sessions.length) return {ok:true,added:0};
  try{
    var res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:c.key,rows:sheetArrays(sessions)})});
    var out=await res.json();
    if(!out||!out.ok) return {ok:false,error:'The sheet turned the rows down'+(out&&out.error?': '+out.error:'')+'. Check the key in Setup.'};
    var now=Date.now(),keys={};
    sessions.forEach(function(s){s.sent=now;s.updatedAt=now;keys[monthKey(s.date)]=1});
    saveLocal();Object.keys(keys).forEach(pushMonth);
    return {ok:true,added:out.added};
  }catch(e){return {ok:false,error:'Couldn\'t reach the sheet. Check your signal and the address in Setup, then send again.'}}
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ---- saving: this device always; your Claude account as well when the page is opened in Claude ---- */
var queue={}, metaTimer=null;
function pushDoc(key,make){
  if(!cloud) return;
  var q=queue[key]||(queue[key]={busy:false,pending:false});
  if(q.busy){q.pending=true;return}
  q.busy=true;
  (async function(){
    do{q.pending=false;try{await cloud.doc(key).set(make());setSync('cloud')}catch(e){setSync(e&&e.code==='quota_exceeded'?'full':'error')}}while(q.pending);
    q.busy=false;
  })();
}
function monthKey(date){return 'm_'+date.slice(0,7)}
function monthDoc(key){var o={};S.sessions.forEach(function(s){if(monthKey(s.date)===key)o[s.id]=s});return {sessions:clone(o),updatedAt:Date.now()}}
function pushMonth(key){pushDoc(key,function(){return monthDoc(key)})}
function pushMeta(){pushDoc('meta',function(){return clone(S.meta)})}
function touch(){S.meta.updatedAt=Date.now();saveLocal();clearTimeout(metaTimer);metaTimer=setTimeout(pushMeta,1500)}
function setSync(s){
  syncState=s;
  $('#sync').textContent={loading:'Checking for saved sessions…',cloud:'Saved to your Claude account and this device.',device:'Saved on this device only. Copy a backup from Setup now and then.',
    error:'Couldn\'t reach your saved data just now. Changes are kept on this device.',full:'Storage in your Claude account is full. Changes are kept on this device.'}[s]||'';
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('device');return}
  try{
    var got=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!got[0]||!got[1]){setSync('device');return}
    var id=await got[1].id(); if(!id){setSync('device');return}
    var col=got[0].collection('data/users/'+id);
    var snap=await Promise.race([col.get(),new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},10000)})]);
    var remoteMeta=null,remoteMonths={};
    snap.docs.forEach(function(d){if(!d.exists)return;var data=clone(d.data());if(d.id==='meta')remoteMeta=data;else if(d.id.indexOf('m_')===0)remoteMonths[d.id]=data});
    var localNewer=!remoteMeta||(S.meta.updatedAt||0)>(remoteMeta.updatedAt||0);
    var gone=new Set((S.meta.deleted||[]).concat(remoteMeta&&remoteMeta.deleted||[]));
    if(remoteMeta&&!localNewer&&valid({meta:remoteMeta,sessions:[]})) S.meta=remoteMeta;
    S.meta.deleted=Array.from(gone);
    var byId={};S.sessions.forEach(function(s){byId[s.id]=s});
    Object.keys(remoteMonths).forEach(function(k){var ss=remoteMonths[k].sessions||{};Object.keys(ss).forEach(function(sid){var r=ss[sid];if(!byId[sid]||(r.updatedAt||0)>(byId[sid].updatedAt||0))byId[sid]=r})});
    S.sessions=Object.keys(byId).map(function(k){return byId[k]}).filter(function(s){return !gone.has(s.id)});
    saveLocal();cloud=col;setSync('cloud');
    var keys=new Set(Object.keys(remoteMonths));S.sessions.forEach(function(s){keys.add(monthKey(s.date))});
    keys.forEach(function(k){var mine=JSON.stringify(monthDoc(k).sessions),theirs=JSON.stringify(remoteMonths[k]?remoteMonths[k].sessions||{}:{});if(mine!==theirs)pushMonth(k)});
    if(localNewer&&S.meta.updatedAt) pushMeta();
    render();
  }catch(e){setSync('error')}
}

/* ---- actions ---- */
function startSession(day){
  S.meta.draft={id:uid(),type:day,date:todayStr(),rpe:'',notes:'',entries:S.meta.program[day].map(function(ex){
    var s=suggest(S,ex);
    return {exId:ex.id,name:ex.name,kind:ex.kind,target:targetText(ex,s.kg),why:s.why,tone:s.tone,last:s.last?setsText(s.last.sets):'',
      sets:s.reps.map(function(r){return {kg:s.kg,reps:r,done:false}})};
  })};
  summary=null;touch();render();window.scrollTo(0,0);
}
function finishSession(){
  var d=S.meta.draft, entries=d.entries.map(function(e){return {exId:e.exId,name:e.name,kind:e.kind,sets:e.sets.filter(function(s){return s.done&&s.reps>0}).map(function(s){return {kg:s.kg,reps:s.reps}})}}).filter(function(e){return e.sets.length});
  if(!entries.length){var m=$('#d-msg');m.hidden=false;m.textContent='Tick at least one set before saving.';return}
  var date=/^\d{4}-\d{2}-\d{2}$/.test(d.date)?d.date:todayStr();
  var session={id:d.id,type:d.type,date:date,rpe:d.rpe||'',notes:d.notes||'',entries:entries,updatedAt:Date.now()};
  var pbs=personalBests(S,session);
  S.sessions.push(session);S.meta.draft=null;stopRest();
  summary={id:session.id,type:session.type,date:session.date,pbs:pbs};
  touch();pushMonth(monthKey(session.date));
  if(sheetCfg().url){summary.sheet='sending';sendToSheet([session]).then(function(r){if(summary&&summary.id===session.id){summary.sheet=r.ok?'sent':r.error;if(route()==='today'&&!S.meta.draft)render()}})}
  render();window.scrollTo(0,0);
}
function startRest(){restStart=Date.now();clearInterval(restTimer);tickRest();restTimer=setInterval(tickRest,1000)}
function tickRest(){var s=Math.floor((Date.now()-restStart)/1000),b=$('#rest');b.hidden=false;b.textContent='Rest '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function stopRest(){clearInterval(restTimer);$('#rest').hidden=true}
function copyOut(text,outId,msgId,what){
  var out=$('#'+outId),msg=$('#'+msgId);
  if(!text){msg.textContent='Nothing to copy yet.';return}
  out.value=text;out.classList.add('show');
  var fail=function(){msg.textContent='Copying was blocked. Select the text above and copy it yourself.';out.focus();out.select()};
  try{navigator.clipboard.writeText(text).then(function(){msg.textContent=what+' copied.'},fail)}catch(e){fail()}
}
function arm(key){if(armed===key){armed=null;return true}armed=key;render();return false}
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,d=S.meta.draft,day=b.dataset.day,i=+b.dataset.i;
  if(a!=='discard'&&a!=='del-session'&&a!=='ex-del'&&a!=='restore') armed=null;
  if(a==='start'){startSession(day)}
  else if(a==='tick'){
    var row=b.closest('.set'),s=d.entries[+row.dataset.e].sets[+row.dataset.s];
    if(!s.done&&!(s.reps>0)){$('#reps-'+row.dataset.e+'-'+row.dataset.s).focus();return}
    s.done=!s.done;b.setAttribute('aria-pressed',s.done?'true':'false');row.classList.toggle('done',s.done);
    if(s.done)startRest();
    $('#load-'+row.dataset.e).textContent=draftLoad(d.entries[+row.dataset.e]);touch();
  }
  else if(a==='add-set'){var e=d.entries[+b.dataset.e],l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:0,reps:l?l.reps:0,done:false});touch();render()}
  else if(a==='del-set'){d.entries[+b.dataset.e].sets.pop();touch();render()}
  else if(a==='finish'){finishSession()}
  else if(a==='discard'){if(arm('discard')){S.meta.draft=null;stopRest();touch();render()}}
  else if(a==='copy-rows'){var one=S.sessions.filter(function(s){return s.id===b.dataset.id});copyOut(sheetRows(one),'out-rows','msg-rows','Rows')}
  else if(a==='copy-all'){var all=S.sessions.slice().sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0});copyOut(sheetRows(all),'out-setup','msg-setup','Rows')}
  else if(a==='copy-backup'){copyOut(JSON.stringify(S),'out-setup','msg-setup','Backup')}
  else if(a==='restore'){
    var o=null;try{o=JSON.parse($('#restore').value)}catch(e){}
    if(!valid(o)){armed=null;$('#msg-restore').textContent='That isn\'t a backup from this app. Paste the whole text you copied with Copy full backup.';return}
    if(arm('restore')){
      var gone=(S.meta.deleted||[]).concat(S.sessions.map(function(s){return s.id})), oldKeys=S.sessions.map(function(s){return monthKey(s.date)});
      S=o;var keep={};S.sessions.forEach(function(s){keep[s.id]=1;s.updatedAt=Date.now()});
      S.meta.deleted=gone.concat(S.meta.deleted||[]).filter(function(id,ix,arr){return !keep[id]&&arr.indexOf(id)===ix});
      plateTarget=null;summary=null;touch();
      new Set(oldKeys.concat(S.sessions.map(function(s){return monthKey(s.date)}))).forEach(pushMonth);render();
    }else{$('#restore').value=JSON.stringify(o)}
  }
  else if(a==='del-session'){
    if(arm('del-'+b.dataset.id)){var gs=S.sessions.filter(function(s){return s.id===b.dataset.id})[0];S.sessions=S.sessions.filter(function(s){return s.id!==b.dataset.id});S.meta.deleted.push(b.dataset.id);if(summary&&summary.id===b.dataset.id)summary=null;touch();if(gs)pushMonth(monthKey(gs.date));render()}
    else{var open=document.querySelectorAll('details');open.forEach(function(el){if(el.querySelector('[data-id="'+b.dataset.id+'"]'))el.open=true})}
  }
  else if(a==='send'||a==='send-unsent'){
    var list=a==='send'?S.sessions.filter(function(s){return s.id===b.dataset.id}):unsent();
    b.disabled=true;b.textContent='Sending\u2026';
    sendToSheet(list).then(function(r){
      sheetMsg=r.ok?(r.added?r.added+' row'+(r.added===1?'':'s')+' added to your sheet.':'Nothing new to add. The sheet already has these sessions.'):r.error;
      if(summary&&a==='send'&&summary.id===b.dataset.id)summary.sheet=r.ok?'sent':r.error;
      render();
    });
  }
  else if(a==='plate-set'){plateTarget=+b.dataset.kg;render()}
  else if(a==='plate-step'){
    var t=totals(S.meta),dir=+b.dataset.dir,next=dir>0?t.filter(function(v){return v>plateTarget+1e-9})[0]:t.filter(function(v){return v<plateTarget-1e-9}).pop();
    if(next!==undefined){plateTarget=next;render()}
  }
  else if(a==='ex-add'){S.meta.program[day].push({id:'x'+uid(),name:'New exercise',kind:'db',sets:3,min:8,max:10,kg:0,step:2,goal:0});touch();render();var all2=document.querySelectorAll('details');}
  else if(a==='ex-up'||a==='ex-down'){var arr=S.meta.program[day],j=a==='ex-up'?i-1:i+1,tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;touch();render()}
  else if(a==='ex-del'){if(arm('ex-'+day+'-'+i)){S.meta.program[day].splice(i,1);touch();render()}else{var dd=document.querySelectorAll('details');dd.forEach(function(el){if(el.querySelector('[data-act="ex-del"][data-day="'+day+'"][data-i="'+i+'"]'))el.open=true})}}
});
document.addEventListener('input',function(ev){
  var t=ev.target,d=S.meta.draft;
  if(d&&t.dataset.f){
    var row=t.closest('.set');
    if(row){var e=d.entries[+row.dataset.e],s=e.sets[+row.dataset.s];
      if(t.dataset.f==='kg'){s.kg=num(t.value);$('#load-'+row.dataset.e).textContent=draftLoad(e)}else s.reps=Math.round(num(t.value));
    }else d[t.dataset.f]=t.value;
    touch();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='plate-target'){plateTarget=num(t.value);render();return}
  if(t.dataset.p){
    var ex=S.meta.program[t.dataset.day][+t.dataset.i],p=t.dataset.p;
    if(p==='name')ex.name=t.value.trim()||ex.name;else if(p==='kind')ex.kind=t.value;
    else if(p==='sets')ex.sets=Math.max(1,Math.min(10,Math.round(num(t.value))||1));
    else if(p==='min'||p==='max'){ex[p]=Math.max(1,Math.round(num(t.value))||1);if(ex.min>ex.max){if(p==='min')ex.max=ex.min;else ex.min=ex.max}}
    else ex[p]=num(t.value);
    touch();var sum=t.closest('details').querySelector('summary');sum.firstChild.textContent=ex.name;sum.lastChild.textContent=targetText(ex,ex.kg);
  }
  if(t.dataset.k==='sheet-url'){sheetCfg().url=t.value.trim();sheetMsg='';touch()}
  if(t.dataset.k==='sheet-key'){sheetCfg().key=t.value.trim();touch()}
  if(t.dataset.k==='bar'){S.meta.bar=num(t.value)||S.meta.bar;plateTarget=null;touch()}
  if(t.dataset.k==='plate'){S.meta.plates[+t.dataset.i].n=Math.max(0,Math.round(num(t.value)));plateTarget=null;touch()}
});
$('#rest').addEventListener('click',stopRest);
window.addEventListener('hashchange',function(){armed=null;sheetMsg='';render();window.scrollTo(0,0)});
setSync('loading');render();initCloud();
</script>
</body>
</html>
